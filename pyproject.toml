[project]
name = "ar-assistant"
version = "0.1.0"
description = "Real-Time Terminal-Based Multimodal Companion powered by Gemini Live"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.34.0",
    "mss>=10.2.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "sounddevice>=0.5.6",
    "websockets>=12.0",
]

[project.scripts]
assistant = "src.main:main"
