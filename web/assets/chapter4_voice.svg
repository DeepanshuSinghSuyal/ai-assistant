<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow4" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#181822" />
      <stop offset="60%" stop-color="#0e0e12" />
      <stop offset="100%" stop-color="#08080a" />
    </radialGradient>
    <linearGradient id="hornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#bgGlow4)" rx="12" />

  <!-- Acoustic Emitter Horn & Expanding Wavefronts -->
  <g transform="translate(240, 175)">
    <!-- Parabolic Acoustic Horn -->
    <path d="M-60 0 C-40 -15 -10 -45 35 -65 L35 65 C-10 45 -40 15 -60 0 Z" fill="url(#hornGrad)" stroke="#ffffff" stroke-width="1.8" />
    <ellipse cx="35" cy="0" rx="14" ry="65" fill="#1e2025" stroke="#ffffff" stroke-width="2" />
    
    <!-- Horn Specular Highlights -->
    <path d="M-50 -2 C-30 -12 0 -35 30 -52" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8" />

    <!-- Concentric Harmonic Wavefronts -->
    <path d="M75 -45 A50 65 0 0 1 75 45" stroke="#cbd5e1" stroke-width="2.5" fill="none" opacity="0.85" />
    <path d="M110 -65 A75 95 0 0 1 110 65" stroke="#94a3b8" stroke-width="2" fill="none" opacity="0.65" />
    <path d="M145 -85 A100 125 0 0 1 145 85" stroke="#64748b" stroke-width="1.5" fill="none" opacity="0.45" />
    <path d="M180 -105 A125 155 0 0 1 180 105" stroke="#475569" stroke-width="1" fill="none" opacity="0.3" stroke-dasharray="4,4" />
  </g>

  <!-- Labels -->
  <text x="36" y="44" font-family="'Space Mono', monospace" font-size="11" fill="#94a3b8" letter-spacing="1.5">STAGE 04 // EXPRESSION LAYER</text>
  <text x="36" y="64" font-family="'Cinzel', serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1">Native Voice &amp; Acoustic Output</text>
  <text x="564" y="325" font-family="'Space Mono', monospace" font-size="10" fill="#64748b" text-anchor="end" letter-spacing="1">24,000 HZ LINEAR PCM / WASAPI</text>
</svg>

