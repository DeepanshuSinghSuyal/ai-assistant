<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow3" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#181822" />
      <stop offset="60%" stop-color="#0e0e12" />
      <stop offset="100%" stop-color="#08080a" />
    </radialGradient>
    <linearGradient id="silverGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="80%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#bgGlow3)" rx="12" />

  <!-- Tri-Axial Gyroscopic Gimbals -->
  <g transform="translate(300, 175)">
    <!-- Outer Gimbal Ring (Chrome) -->
    <ellipse cx="0" cy="0" rx="100" ry="92" fill="none" stroke="url(#silverGlow)" stroke-width="2.5" />
    <circle cx="-100" cy="0" r="3" fill="#ffffff" />
    <circle cx="100" cy="0" r="3" fill="#ffffff" />

    <!-- Middle Gimbal Ring (Platinum, Tilted) -->
    <ellipse cx="0" cy="0" rx="82" ry="48" fill="none" stroke="#cbd5e1" stroke-width="2" transform="rotate(35)" />
    
    <!-- Inner Gimbal Ring (Dark Titanium, Counter-Tilted) -->
    <ellipse cx="0" cy="0" rx="68" ry="34" fill="none" stroke="#94a3b8" stroke-width="1.8" transform="rotate(-40)" />

    <!-- Central Faceted Liquid Silver Core (Icosahedron Crystal) -->
    <polygon points="0,-36 30,-12 30,24 0,38 -30,24 -30,-12" fill="#1e293b" stroke="#ffffff" stroke-width="2" />
    <!-- Inner Facets -->
    <line x1="0" y1="-36" x2="0" y2="38" stroke="#cbd5e1" stroke-width="1.2" />
    <line x1="0" y1="-36" x2="30" y2="24" stroke="#94a3b8" stroke-width="1" />
    <line x1="0" y1="-36" x2="-30" y2="24" stroke="#94a3b8" stroke-width="1" />
    <line x1="-30" y1="-12" x2="30" y2="-12" stroke="#ffffff" stroke-width="1.5" />
    <line x1="-30" y1="24" x2="30" y2="24" stroke="#cbd5e1" stroke-width="1" />

    <!-- Core Specular Flare -->
    <circle cx="-8" cy="-10" r="5" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Labels -->
  <text x="36" y="44" font-family="'Space Mono', monospace" font-size="11" fill="#94a3b8" letter-spacing="1.5">STAGE 03 // COGNITIVE CORE</text>
  <text x="36" y="64" font-family="'Cinzel', serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1">Gemini 3.1 Live Fusion Core</text>
  <text x="564" y="325" font-family="'Space Mono', monospace" font-size="10" fill="#64748b" text-anchor="end" letter-spacing="1">MULTIMODAL ARBITRATION / &lt; 1.8S</text>
</svg>

