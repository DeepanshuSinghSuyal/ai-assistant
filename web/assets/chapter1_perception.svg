<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#181822" />
      <stop offset="60%" stop-color="#0e0e12" />
      <stop offset="100%" stop-color="#08080a" />
    </radialGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#94a3b8" />
      <stop offset="55%" stop-color="#f8fafc" />
      <stop offset="85%" stop-color="#475569" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="platGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" fill="url(#bgGlow)" rx="12" />

  <!-- Studio Ambient Grid Lines (Hairline) -->
  <circle cx="300" cy="180" r="140" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  <circle cx="300" cy="180" r="105" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="3,3" />
  <circle cx="300" cy="180" r="70" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Concentric Floating Sonic Rings -->
  <ellipse cx="300" cy="180" rx="95" ry="34" fill="none" stroke="url(#platGrad)" stroke-width="1.8" opacity="0.65" transform="rotate(-15 300 180)" />
  <ellipse cx="300" cy="180" rx="120" ry="42" fill="none" stroke="url(#platGrad)" stroke-width="1.2" opacity="0.4" transform="rotate(-15 300 180)" />
  <ellipse cx="300" cy="180" rx="145" ry="50" fill="none" stroke="url(#platGrad)" stroke-width="0.8" opacity="0.25" transform="rotate(-15 300 180)" />

  <!-- Central Acoustic Sound Capsule -->
  <g transform="translate(300, 180)">
    <!-- Shadow -->
    <ellipse cx="0" cy="90" rx="45" ry="12" fill="#000000" opacity="0.6" filter="blur(6px)" />

    <!-- Outer Capsule Body -->
    <rect x="-32" y="-65" width="64" height="130" rx="32" fill="url(#chromeGrad)" stroke="#ffffff" stroke-width="1.5" />
    
    <!-- Specular Highlight Strip -->
    <path d="M-18 -60 Q-24 0 -18 60" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.75" />
    <path d="M-12 -62 Q-16 0 -12 62" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.4" />

    <!-- Center Mesh Division Band -->
    <rect x="-32" y="-12" width="64" height="24" fill="#1e2025" stroke="#94a3b8" stroke-width="1" />
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#ffffff" stroke-width="1" opacity="0.6" stroke-dasharray="2,2" />

    <!-- Acoustic Waveform Stream entering capsule -->
    <path d="M-180 -10 Q-140 -35 -100 -10 T-40 -10" fill="none" stroke="#e2e8f0" stroke-width="2" opacity="0.7" />
    <path d="M-180 15 Q-140 -10 -100 15 T-40 15" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.5" />
  </g>

  <!-- High-Tech Architectural Labeling -->
  <text x="36" y="44" font-family="'Space Mono', monospace" font-size="11" fill="#94a3b8" letter-spacing="1.5">STAGE 01 // AUDIO PERCEPTION</text>
  <text x="36" y="64" font-family="'Cinzel', serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1">Audio Perception Capsule</text>
  <text x="564" y="325" font-family="'Space Mono', monospace" font-size="10" fill="#64748b" text-anchor="end" letter-spacing="1">16,000 HZ / LIVE VOICE INPUT</text>
</svg>

